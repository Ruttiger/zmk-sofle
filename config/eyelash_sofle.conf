CONFIG_BT_DEVICE_NAME="Eyelash Sofle BT"
CONFIG_BT_DEVICE_NAME_MAX=20

# Sleep after 30 mins (30*60*1000ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_SLEEP=y
#soft off
CONFIG_ZMK_PM_SOFT_OFF=y

# MOUSE
CONFIG_ZMK_POINTING=y

# Enables a combination of settings that are planned to be default in future
# versions of ZMK to improve connection stability. This includes changes to
# timing on BLE pairing initiation, restores use of the updated/new LLCP
# implementation, and disables 2M PHY support.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# Report type NKRO enabled
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

# Stable OLED baseline: upstream mctechnology17/zmk-nice-oled with the
# existing SSD1306 hardware overlays in the Eyelash Sofle shields.
CONFIG_ZMK_DISPLAY=y
CONFIG_I2C=y
CONFIG_SSD1306=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# nice_oled uses a portrait canvas and rotates it 90° clockwise before the
# SSD1306 driver sends the frame.  64x128 therefore maps to the full physical
# 128x64 panel; the upstream defaults (68x160) target nice!view/ePaper.
CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH=64
CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT=128
CONFIG_NICE_OLED_WIDGET_INVERTED=y
# Keep the screen visible during initial hardware validation; deep sleep is
# still controlled by the existing ZMK sleep/soft-off settings below.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_NICE_OLED_ON=y

# Minimal central screen: output (USB/BLE/profile), battery, active layer.
CONFIG_NICE_OLED_WIDGET_WPM=n
CONFIG_NICE_OLED_WIDGET_LAYER=y
CONFIG_NICE_OLED_WIDGET_PROFILE_BIG=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n
CONFIG_ZMK_HID_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_LUNA=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL=n

# Keep the peripheral static and deterministic.  No Luna, Bongo Cat,
# speedometer, WPM graph, sleep art, RAW HID, Spotify, weather or time.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n
CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL_VIM=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SMART_BATTERY=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_WPM=n
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_IDLE=n
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_SLEEP=n

# Positions are in the upstream portrait canvas and stay inside 64x128.
CONFIG_NICE_OLED_WIDGET_OUTPUT_USB_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_OUTPUT_USB_CUSTOM_Y=32
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_Y=32
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_UNBONDED_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_UNBONDED_CUSTOM_Y=32
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_Y=96
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_Y=112
CONFIG_NICE_OLED_WIDGET_PROFILE_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_PROFILE_CUSTOM_Y=88
CONFIG_NICE_OLED_WIDGET_PROFILE_TEXT_CUSTOM_X=36
CONFIG_NICE_OLED_WIDGET_PROFILE_TEXT_CUSTOM_Y=85

# Report battery peripheral battery level
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# The EC11 driver must use interrupts; otherwise the encoder node is present
# but rotation does not emit events.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
